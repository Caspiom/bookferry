<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bookferry Spike - Fase 3 (Rede Local)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 8px;
      background: #1e1e2e;
      color: #cdd6f4;
      overflow-x: hidden;
    }
    h1 { font-size: 1.05rem; margin: 4px 0 6px; }
    #sync-banner {
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #313244;
      border-left: 4px solid #89b4fa;
      color: #f9e2af;
      font-family: monospace;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    button {
      font-size: 0.8rem;
      padding: 6px 9px;
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #585b70;
      border-radius: 4px;
    }
    #out {
      margin: 0;
      padding: 8px;
      background: #11111b;
      color: #a6e3a1;
      font-family: monospace;
      font-size: 0.72rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 45vh;
      overflow-y: auto;
      border: 1px solid #313244;
    }
    #comic-stage {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      touch-action: none;
      z-index: 100;
    }
    #comic-img {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      max-width: none;
      max-height: none;
    }
    #comic-hud {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 101;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: auto;
    }
    #work-stage {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    #pdf-canvas {
      border: 1px solid #45475a;
      max-width: 100%;
      background: #fff;
      will-change: transform;
      transform-origin: 0 0;
    }
    #epub-container {
      width: 800px;
      height: 600px;
      background: #fff;
      color: #000;
      border: 1px solid #45475a;
      position: relative;
      overflow: hidden;
    }
    foliate-view {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Bookferry Spike — Fase 3 (LAN + Sync)</h1>
  <div id="sync-banner">Posição atual: (aguardando sync LAN...)</div>
  <div class="controls">
    <button id="btn-ping">Ping</button>
    <button id="btn-f3-mdns">F3: mDNS</button>
    <button id="btn-f3-pair">F3: TLS+Pair</button>
    <button id="btn-f3-pull">F3: Pull Pos</button>
    <button id="btn-f3-lww">F3: LWW</button>
    <button id="btn-f3-range">F3: Range 295MB</button>
    <button id="btn-saf-one">R1: SAF</button>
    <button id="btn-r2-cbz">R2: CBZ</button>
  </div>
  <pre id="out">(inicializando...)</pre>

  <div id="comic-stage">
    <div id="comic-hud">
      <span id="comic-hud-text">CBZ Fullscreen</span>
      <button id="btn-close-comic">Fechar</button>
    </div>
    <img id="comic-img" alt="comic page" />
  </div>

  <div id="work-stage">
    <div id="epub-container"></div>
    <canvas id="pdf-canvas"></canvas>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
