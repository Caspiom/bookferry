[workspace]
resolver = "2"
members = [
    "crates/bookferry-core",
    "crates/bookferry-server",
    "crates/bookferry-client",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bookferry-core = { path = "crates/bookferry-core" }
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
getrandom = "0.2"
http-body-util = "0.1"
httpdate = "1.0"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
md-5 = "0.10"
mdns-sd = "0.11"
proptest = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
